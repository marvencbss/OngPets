<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>OngPets - Cadastrar Pet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --rosa: #EBA9B5; --creme: #F1EDE1; --azul: #2B5EA9; }
        body { background-color: var(--creme); font-family: 'Nunito', sans-serif; }
        nav { background-color: var(--azul); padding: 1rem 2rem; display: flex; align-items: center; }
        .nav-brand { font-family: 'Fredoka', sans-serif; font-size: 1.6rem; color: var(--creme); text-decoration: none; }
        .card { border: none; border-radius: 16px; }
        h4 { font-family: 'Fredoka', sans-serif; color: var(--azul); font-size: 1.6rem; }
        .form-label { font-weight: 600; color: #444; }
        .form-control:focus, .form-select:focus { border-color: var(--azul); box-shadow: 0 0 0 0.2rem rgba(43,94,169,0.15); }
        .btn-cadastrar { background: var(--azul); color: var(--creme); border: none; border-radius: 50px; font-weight: 600; font-family: 'Nunito', sans-serif; padding: 0.6rem 1.5rem; width: 100%; }
        .btn-cadastrar:hover { opacity: 0.85; color: var(--creme); }
        .btn-cancelar { background: transparent; color: var(--azul); border: 1.5px solid var(--azul); border-radius: 50px; font-weight: 600; font-family: 'Nunito', sans-serif; padding: 0.6rem 1.5rem; width: 100%; text-decoration: none; text-align: center; }
        .btn-cancelar:hover { background: var(--azul); color: var(--creme); }
    </style>
</head>
<body>

<nav>
    <a class="nav-brand" href="/">OngPets</a>
</nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4 class="mb-4">Cadastrar Pet</h4>

                    <form th:action="@{/animais}" th:object="${animal}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Nome</label>
                            <input type="text" class="form-control" th:field="*{nome}" placeholder="Ex: Rex" required>
                        </div>

                        <div class="row mb-3">
                            <div class="col">
                                <label class="form-label">Espécie</label>
                                <select class="form-select" th:field="*{especie}" required>
                                    <option value="">Selecione...</option>
                                    <option value="Cachorro">Cachorro</option>
                                    <option value="Gato">Gato</option>
                                </select>
                            </div>
                            <div class="col">
                                <label class="form-label">Status</label>
                                <select class="form-select" th:field="*{status}" required>
                                    <option value="">Selecione...</option>
                                    <option value="Perdido">Perdido</option>
                                    <option value="Encontrado">Encontrado</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Raça</label>
                            <input type="text" class="form-control" th:field="*{raca}" placeholder="Ex: Labrador">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Descrição</label>
                            <textarea class="form-control" th:field="*{descricao}" rows="3"
                                      placeholder="Características, coleira, comportamento..."></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">URL da Imagem</label>
                            <input type="text" class="form-control" th:field="*{imagemUrl}" placeholder="https://...">
                        </div>

                        <div class="row mb-3">
                            <div class="col">
                                <label class="form-label">Cidade</label>
                                <input type="text" class="form-control" th:field="*{cidade}" placeholder="Ex: São Leopoldo">
                            </div>
                            <div class="col">
                                <label class="form-label">Data da Ocorrência</label>
                                <input type="date" class="form-control" th:field="*{dataOcorrencia}">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Contato</label>
                            <input type="text" class="form-control" th:field="*{contato}" placeholder="Ex: (51) 99999-9999">
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn-cadastrar">Cadastrar</button>
                            <a th:href="@{/animais}" class="btn-cancelar">Cancelar</a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
